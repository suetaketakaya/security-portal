<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VATL-100 エミュレーター | Virtual Automotive Test Lab</title>
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/">Virtual Automotive Test Lab</a>
      <nav>
        <a href="/">エミュレーター</a>
        <a href="/spec">仕様書</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <p class="note">車載インフォテインメント「VATL-100」のエミュレーターです。<a href="/spec">仕様書</a>を読んでテストケースを設計し、ここで実行してください。※ ワークショップ用の架空の製品です。</p>

    <div class="lab">
      <!-- ヘッドユニット -->
      <section class="unit" aria-label="ヘッドユニット">
        <div id="screen" class="screen" data-view="off">
          <!-- 電源OFF / 起動中 -->
          <div class="view" data-for="off"></div>
          <div class="view" data-for="booting"><p class="center">VATL-100<br>起動中…</p></div>

          <!-- バックカメラ -->
          <div class="view camera" data-for="camera">
            <p class="center">バックカメラ</p>
            <p class="guide">周囲の安全を直接確認してください</p>
          </div>

          <!-- 電話 -->
          <div class="view" data-for="call">
            <p id="call-title" class="center"></p>
            <div class="soft-buttons">
              <button type="button" data-press="answer" id="btn-answer">応答</button>
              <button type="button" data-press="reject" id="btn-reject" class="danger">拒否</button>
              <button type="button" data-press="hangup" id="btn-hangup" class="danger">終話</button>
            </div>
          </div>

          <!-- ホーム -->
          <div class="view" data-for="home">
            <div class="status-bar">
              <span id="st-source"></span>
              <span id="st-volume"></span>
            </div>
            <p id="st-media" class="media"></p>
            <div class="soft-buttons">
              <button type="button" data-press="tuneDown" id="btn-tune-down">◀ 選局</button>
              <button type="button" data-press="tuneUp" id="btn-tune-up">選局 ▶</button>
            </div>
            <div id="route" class="route" hidden>
              <span id="route-text"></span>
              <button type="button" data-press="cancelRoute" class="secondary">案内中止</button>
            </div>
            <div class="soft-buttons">
              <button type="button" data-press="navi">目的地検索</button>
              <button type="button" data-press="settings">設定</button>
            </div>
          </div>

          <!-- 目的地検索 -->
          <div class="view" data-for="navi">
            <h3>目的地検索</h3>
            <form id="search-form" class="search">
              <input id="keyword" type="text" autocomplete="off" placeholder="施設名を入力">
              <button type="submit">検索</button>
            </form>
            <ul id="results" class="results"></ul>
          </div>

          <!-- 設定 -->
          <div class="view" data-for="settings">
            <h3>設定</h3>
            <p>画面の明るさ：<strong id="st-bright"></strong></p>
            <div class="soft-buttons">
              <button type="button" data-press="brightDown">－</button>
              <button type="button" data-press="brightUp">＋</button>
            </div>
          </div>

          <p id="message" class="toast" role="status"></p>
        </div>

        <div class="hard-buttons">
          <button type="button" data-press="volDown">VOL －</button>
          <button type="button" data-press="volUp">VOL ＋</button>
          <button type="button" data-press="mute">MUTE</button>
          <button type="button" data-press="source">SOURCE</button>
          <button type="button" data-press="home">HOME</button>
        </div>
      </section>

      <!-- 車両信号 -->
      <section class="panel" aria-label="車両信号パネル">
        <h2>車両信号</h2>
        <label class="row"><input id="sig-acc" type="checkbox"> ACC（エンジンスイッチ）ON</label>
        <label class="row">車速
          <input id="sig-speed-range" type="range" min="0" max="180" step="1" value="0">
          <input id="sig-speed" type="number" min="0" max="180" step="1" value="0"> km/h
        </label>
        <fieldset class="row">
          <legend>シフト</legend>
          <label><input type="radio" name="shift" value="P" checked> P</label>
          <label><input type="radio" name="shift" value="R"> R</label>
          <label><input type="radio" name="shift" value="D"> D</label>
        </fieldset>
        <label class="row"><input id="sig-usb" type="checkbox"> USBメモリ接続</label>
        <label class="row"><input id="sig-bt" type="checkbox"> スマートフォン Bluetooth接続</label>
        <p class="row"><button type="button" id="sig-call">着信を発生させる</button></p>
        <p class="row"><button type="button" id="sig-reset" class="secondary">工場出荷状態に戻す</button></p>

        <h2>状態</h2>
        <table class="state"><tbody id="state"></tbody></table>
      </section>
    </div>

    <section aria-label="操作ログ">
      <h2>操作ログ</h2>
      <p class="actions">
        <button type="button" id="log-copy" class="secondary">ログをコピー</button>
        <button type="button" id="log-clear" class="secondary">ログを消去</button>
      </p>
      <ol id="log" class="log"></ol>
    </section>
  </main>
</body>
</html>
