<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>受付枠の管理 | ZooPass</title>
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/admin.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/">ZooPass</a>
      <nav>
        <a id="nav-login" href="/login">ログイン</a>
        <a id="nav-mypage" href="/mypage" hidden>マイページ</a>
        <button id="nav-logout" type="button" hidden>ログアウト</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section>
      <h1>受付枠の管理</h1>
      <p id="admin-status">確認中…</p>

      <form id="slot-form" class="form inline" hidden>
        <label>開始日 <input name="start" type="date" required></label>
        <label>日数 <input name="days" type="number" min="1" max="60" value="30" required></label>
        <label>1日の定員 <input name="capacity" type="number" min="1" max="100000" value="100" required></label>
        <button type="submit">枠を作成</button>
      </form>
      <p id="message" class="message" role="status"></p>
      <p class="note">すでに枠がある日はスキップします（定員の変更はできません）。</p>
    </section>
  </main>
</body>
</html>
