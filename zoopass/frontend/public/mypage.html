<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ | ZooPass</title>
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/mypage.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/">ZooPass</a>
      <nav>
        <a id="nav-login" href="/login">ログイン</a>
        <a id="nav-mypage" href="/mypage" hidden>マイページ</a>
        <button id="nav-logout" type="button" hidden>ログアウト</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section>
      <h1>マイページ</h1>
      <p>ログイン中：<span id="user-email"></span></p>
    </section>

    <section>
      <h2>新しく予約する</h2>
      <form id="reserve-form" class="form inline">
        <label>日付 <input name="date" type="date" required></label>
        <label>枚数 <input name="tickets" type="number" min="1" max="10" value="1" required></label>
        <button type="submit">予約する</button>
      </form>
      <p id="message" class="message" role="status"></p>
    </section>

    <section>
      <h2>予約一覧</h2>
      <p id="list-status"></p>
      <table>
        <thead><tr><th>日付</th><th>枚数</th><th>状態</th><th></th></tr></thead>
        <tbody id="reservations"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
