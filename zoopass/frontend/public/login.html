<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | ZooPass</title>
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/">ZooPass</a>
      <nav>
        <a id="nav-login" href="/login">ログイン</a>
        <a id="nav-mypage" href="/mypage" hidden>マイページ</a>
        <button id="nav-logout" type="button" hidden>ログアウト</button>
      </nav>
    </div>
  </header>

  <main class="container narrow">
    <section>
      <h1>ログイン / 会員登録</h1>
      <form id="auth-form" class="form">
        <label>メールアドレス
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>パスワード（8文字以上）
          <input name="password" type="password" autocomplete="current-password" minlength="8" required>
        </label>
        <div class="actions">
          <button type="submit" name="action" value="login">ログイン</button>
          <button type="submit" name="action" value="register" class="secondary">新規登録</button>
        </div>
        <p id="message" class="message" role="alert"></p>
      </form>
    </section>
  </main>
</body>
</html>
